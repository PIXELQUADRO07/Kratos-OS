# /etc/X11/xorg.conf — KratosOS Live Environment Configuration
# Software KMS (no GL accel): avoids a black XFCE desktop on QEMU/simpledrm.

Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
    Option "DontVTSwitch" "false"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "Files"
    FontPath "/usr/share/fonts/TTF"
    FontPath "/usr/share/fonts/dejavu"
    FontPath "/usr/share/fonts/X11/misc"
    FontPath "built-ins"
EndSection

Section "Device"
    Identifier "Card0"
    Driver "modesetting"
    Option "AccelMethod" "none"
    Option "SWCursor" "on"
    Option "ShadowFB" "true"
    Option "PrimaryGPU" "true"
EndSection

Section "OutputClass"
    Identifier "modesetting"
    MatchDriver "i915|amdgpu|radeon|nouveau|vmwgfx|bochs-drm|virtio-gpu|simpledrm|cirrus|qxl"
    Driver "modesetting"
    Option "AccelMethod" "none"
    Option "SWCursor" "on"
    Option "ShadowFB" "true"
EndSection

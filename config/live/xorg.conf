# /etc/X11/xorg.conf — Basic fallback X11 configuration for KratosOS Live

Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
    Option "AllowEmptyInput" "false"
EndSection

Section "Device"
    Identifier "Card0"
    Driver "modesetting"
EndSection

Section "Device"
    Identifier "CardFallback"
    Driver "fbdev"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Card0"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1024x768" "1280x720" "1920x1080"
    EndSubSection
EndSection

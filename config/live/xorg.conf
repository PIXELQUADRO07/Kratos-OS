# /etc/X11/xorg.conf — KratosOS Live Environment Configuration
#
# Minimal configuration to allow Xorg auto-detection to work (Parrot OS style).
# Most modern systems work best without a hardcoded config.

Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
    # Allow Xorg to switch VTs
    Option "DontVTSwitch" "false"
EndSection

Section "Device"
    Identifier  "AllCards"
    Driver      "modesetting"
    # Essential for modern UEFI/KMS systems.
    # Xorg will fall back to other drivers if this fails.
EndSection

# /etc/X11/xorg.conf — KratosOS Live Environment Configuration
#
# Minimal configuration with explicit fallback from modesetting to fbdev.

Section "ServerLayout"
    Identifier "DefaultLayout"
    Screen 0 "ScreenModesetting"
    Screen 1 "ScreenFbdev"
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
    Option "DontVTSwitch" "false"
EndSection

Section "Device"
    Identifier  "DeviceModesetting"
    Driver      "modesetting"
EndSection

Section "Device"
    Identifier  "DeviceFbdev"
    Driver      "fbdev"
EndSection

Section "Screen"
    Identifier "ScreenModesetting"
    Device     "DeviceModesetting"
EndSection

Section "Screen"
    Identifier "ScreenFbdev"
    Device     "DeviceFbdev"
EndSection

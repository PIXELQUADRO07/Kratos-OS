# /etc/X11/xorg.conf — KratosOS Live Environment Configuration
#
# Single Screen using the modesetting driver (built into xorg-server).
# Dual Screen layouts are not a fallback: they require two displays and
# the fbdev driver, which is not shipped.

Section "ServerLayout"
    Identifier "DefaultLayout"
    Screen 0 "Screen0"
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
    Option "DontVTSwitch" "false"
EndSection

Section "Device"
    Identifier  "Card0"
    # Do not pin a driver: Xorg will try modesetting (DRM/simpledrm),
    # then xf86-video-fbdev, then xf86-video-vesa. Pinning modesetting
    # breaks the nomodeset/safe-graphics live entry when DRM is off.
EndSection

Section "Screen"
    Identifier "Screen0"
    Device     "Card0"
EndSection

# /etc/X11/xorg.conf — KratosOS Live Environment Configuration

Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
EndSection

Section "Device"
    Identifier  "VideoCard-Modesetting"
    Driver      "modesetting"
    # Essential for modern UEFI/KMS systems
EndSection

Section "Device"
    Identifier  "VideoCard-FBDev"
    Driver      "fbdev"
    # Fallback for old BIOS or restricted UEFI
EndSection

Section "Screen"
    Identifier "Screen0"
    Device     "VideoCard-Modesetting"
    DefaultDepth 24
EndSection

Section "Screen"
    Identifier "ScreenFallback"
    Device     "VideoCard-FBDev"
    DefaultDepth 24
EndSection

Section "ServerLayout"
    Identifier "DefaultLayout"
    Screen 0 "Screen0"
    Screen 1 "ScreenFallback"
EndSection

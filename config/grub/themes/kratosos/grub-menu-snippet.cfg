# =========================================================
#  Voci di menu KratosOS
#  Da incollare/adattare in /etc/grub.d/40_custom
#  oppure in /boot/grub2/grub.cfg
# =========================================================

# --- Attiva il tema grafico ---
set theme=/boot/grub2/themes/kratosos/theme.txt
export theme

# --- Fallback testuale (se il tema grafico non è disponibile) ---
set color_normal=light-gray/black
set color_highlight=black/red

menuentry "Boot KratosOS Live" {
    linux /live/vmlinuz boot=live quiet splash
    initrd /live/initrd.img
}

menuentry "Boot KratosOS Live (safe mode)" {
    linux /live/vmlinuz boot=live nomodeset quiet
    initrd /live/initrd.img
}

menuentry "Boot KratosOS Live (Debug mode)" {
    linux /live/vmlinuz boot=live debug
    initrd /live/initrd.img
}

menuentry "Boot KratosOS Live (Recovery mode)" {
    linux /live/vmlinuz boot=live single
    initrd /live/initrd.img
}

menuentry "Reboot system" {
    reboot
}

menuentry "Poweroff system" {
    halt
}

# Mount module configuration for KratosOS
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: tmpfs
      fs: tmpfs
      mountPoint: /tmp
      options: [ mode=1777 ]

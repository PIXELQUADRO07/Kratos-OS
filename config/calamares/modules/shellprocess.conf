# Shellprocess module configuration for KratosOS post-install cleanup and setup
---
dontChroot: false
timeout: 120
script:
    - name: "Remove live user and live startup scripts"
      command: "/bin/sh -c 'userdel -r kratos-live 2>/dev/null || true; rm -f /etc/rc.d/99-live /etc/live/kratosos-live.desktop /home/*/Desktop/kratosos-live.desktop'"
    - name: "Setup default permissions"
      command: "/bin/sh -c 'chmod 1777 /tmp /run/shm 2>/dev/null || true; chmod 0700 /root'"
    - name: "Setup /etc/mtab symlink"
      command: "/bin/sh -c 'ln -sf /proc/self/mounts /etc/mtab 2>/dev/null || true'"
    - name: "Generate machine-id if missing"
      command: "/bin/sh -c '[ -s /etc/machine-id ] || (dbus-uuidgen --ensure=/etc/machine-id 2>/dev/null || dd if=/dev/urandom bs=16 count=1 2>/dev/null | md5sum | cut -d\" \" -f1 > /etc/machine-id)'"

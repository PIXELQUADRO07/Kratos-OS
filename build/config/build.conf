#!/usr/bin/env bash

export KRATOS_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)"

export KRATOS_BUILD="$KRATOS_ROOT/build"
export KRATOS_DOWNLOADS="$KRATOS_BUILD/downloads"
export KRATOS_SOURCES="$KRATOS_BUILD/sources"
export KRATOS_WORK="$KRATOS_BUILD/work"
export KRATOS_TOOLS="$KRATOS_BUILD/tools"
export KRATOS_SYSROOT="$KRATOS_BUILD/sysroot"

export TARGET="x86_64-kratos-linux-gnu"

export PATH="$KRATOS_TOOLS/bin:$PATH"
